<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tender Package Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--ink:#14232e;--mut:#5d6f7c;--bg:#eef2f4;--card:#fff;--line:#d5dee3;--brand:#0f4c6e;--brand2:#0a3550;--ok:#12805c;--okbg:#e2f5ed;--bad:#b3261e;--badbg:#fdeaea;--warn:#9a5b00;--warnbg:#fff3dc;--none:#5d6f7c;--nonebg:#e8edf0}
*{box-sizing:border-box}
body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
button,select,input{font:inherit}
header{background:var(--brand);color:#fff;position:sticky;top:0;z-index:5}
.hw{max-width:1180px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.hw img{width:44px;height:44px;border-radius:8px}
.hw h1{font-size:19px;margin:0;font-weight:700;flex:1;line-height:1.2}
.hw small{display:block;font-weight:400;opacity:.8;font-size:13px}
.lang{display:flex;border:2px solid #fff;border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:5px 14px;cursor:pointer;font-weight:600}
.lang button.on{background:#fff;color:var(--brand)}
main{max-width:1180px;margin:auto;padding:20px}
.steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.step{flex:1;min-width:150px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--nonebg);display:grid;place-items:center;font-size:14px;flex:none}
.step.done{border-color:var(--ok)}.step.done i{background:var(--ok);color:#fff}
.step.now{border-color:var(--brand)}.step.now i{background:var(--brand);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
h2{font-size:18px;margin:0 0 12px}
.drop{border:3px dashed #93aab8;border-radius:12px;padding:26px;text-align:center;background:#f8fbfc;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--brand);background:#eaf4f9}
.drop b{font-size:18px;display:block}.drop span{color:var(--mut);font-size:14px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 20px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--brand2)}
.btn.sec{background:#fff;color:var(--brand);border:2px solid var(--brand);padding:8px 16px}
.btn.big{font-size:18px;padding:14px 30px}
.btn:disabled{background:#b7c3cb;border-color:#b7c3cb;color:#fff;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tg div{background:var(--bg);border-radius:8px;padding:8px 12px}.tg small{color:var(--mut);display:block;font-size:13px}.tg b{font-size:16px}
.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:3px 12px;border-radius:99px;font-size:14px;font-weight:600}
.bar{height:10px;background:var(--nonebg);border-radius:9px;overflow:hidden;margin-bottom:14px}.bar div{height:100%;background:var(--ok);transition:width .3s}
.rc{border:1px solid var(--line);border-left:6px solid var(--none);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
.rc.missing,.rc.needexp,.rc.expired{border-left-color:var(--bad)}.rc.ok{border-left-color:var(--ok)}.rc.notprov{border-left-color:#9fb0ba}
.rt{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.no{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.rt strong{font-size:17px;flex:1;min-width:160px}.rt strong small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.tag{font-size:12px;padding:1px 8px;border-radius:5px;background:var(--nonebg);color:var(--mut);font-weight:600}
.st{padding:3px 12px;border-radius:99px;font-weight:700;font-size:14px;white-space:nowrap}
.s-ok{background:var(--okbg);color:var(--ok)}.s-missing,.s-expired{background:var(--badbg);color:var(--bad)}.s-needexp{background:var(--warnbg);color:var(--warn)}.s-notprov{background:var(--nonebg);color:var(--none)}
.rr{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:end}
.rr label{font-size:13px;color:var(--mut);display:block;font-weight:600}
.rr select,.rr input{padding:7px 9px;border:2px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
.rr select{min-width:220px;flex:1}
.x{background:none;border:2px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--mut);font-weight:600}.x:hover{border-color:var(--bad);color:var(--bad)}
.msg{font-size:14px;margin-top:6px;color:var(--mut)}
.fi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:start}
.fi.dup{border-color:var(--warn);background:var(--warnbg)}
.fi div{flex:1;min-width:0;word-break:break-all}.fi b{font-size:15px}.fi small{display:block;color:var(--mut)}
.al{padding:10px 14px;border-radius:9px;margin-bottom:8px;display:flex;gap:10px;background:var(--badbg);color:var(--bad);font-weight:500}.al span{flex:1}.al button{background:none;border:0;cursor:pointer;color:inherit;font-size:18px}
.al.i{background:var(--okbg);color:var(--ok)}
.why{background:var(--badbg);border-radius:10px;padding:10px 16px;margin:0 0 14px;color:var(--bad)}.why ul{margin:4px 0 0;padding-left:20px}
.good{background:var(--okbg);color:var(--ok);border-radius:10px;padding:10px 16px;margin-bottom:14px;font-weight:600}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px;text-align:left}.how div{background:var(--bg);padding:12px;border-radius:10px;font-size:15px}.how b{display:block}
.empty{color:var(--mut);text-align:center;padding:14px}

body{background:linear-gradient(180deg,#d6e6ee 0,#eef2f4 380px) no-repeat,var(--bg)}
header{background:linear-gradient(110deg,#0a3550,#0f4c6e 60%,#1b7f8e);box-shadow:0 2px 12px #0a355055}
.card{box-shadow:0 2px 10px #0f4c6e14;border-radius:14px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center;background:linear-gradient(120deg,#0a3550,#0f4c6e 55%,#1b7f8e);color:#fff;border-radius:18px;padding:30px;margin-bottom:18px;box-shadow:0 8px 24px #0a355044}
.hero h2{font-size:30px;line-height:1.25;margin:0 0 8px}.hero p{margin:0 0 18px;opacity:.9;font-size:17px}
.hero .drop{background:#fff;color:var(--ink);border-style:dashed}.art{width:100%;max-width:280px;justify-self:center;filter:drop-shadow(0 10px 18px #0006)}
@media(max-width:760px){.hero{grid-template-columns:1fr}.art{display:none}.hero h2{font-size:24px}}
.how{margin:0 0 18px}.how div{position:relative;background:#fff;border:1px solid var(--line);padding:16px;border-radius:14px}
.how em{position:absolute;top:10px;right:12px;font-style:normal;font-weight:700;color:#b9c8d1;font-size:26px}.hi{font-size:28px;display:block;margin-bottom:4px}
.need ul,.tips ul{margin:0;padding-left:22px}.need li,.tips li{margin-bottom:6px}.tips{background:#fffbea;border-color:#f0dd9a}
.priv{text-align:center;color:var(--mut);font-size:14px;padding:6px 0 18px}
.sh{display:flex;gap:12px;align-items:center;margin-bottom:14px}.sh h2{margin:0}.sh p{margin:0;color:var(--mut);font-size:14px}
.ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#e1f0f6,#c8e2ee);display:grid;place-items:center;font-size:22px;flex:none}
.nxt{background:#e6f1f7;border:2px solid #b7d5e4;color:var(--brand2);border-radius:12px;padding:12px 16px;font-weight:600;margin-bottom:14px}
.nxt.warn{background:var(--warnbg);border-color:#f0d08a;color:var(--warn)}.nxt.good2{background:var(--okbg);border-color:#9fd8bf;color:var(--ok)}
.step{position:relative}.step:not(:last-child)::after{content:'';position:absolute;right:-9px;top:50%;width:10px;height:3px;background:var(--line)}
.step.done{background:#f2fbf7}.step.now{box-shadow:0 0 0 4px #0f4c6e22}
.ro{margin:14px 0 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.dl{background:#e6f1f7;color:var(--brand2);padding:5px 14px;border-radius:99px;font-weight:600;font-size:14px}.dl.soon{background:var(--warnbg);color:var(--warn)}.dl.late{background:var(--badbg);color:var(--bad)}
.di{font-size:22px}.rc{border-radius:12px;box-shadow:0 1px 4px #0f4c6e10;transition:box-shadow .2s}.rc:hover{box-shadow:0 4px 14px #0f4c6e22}
.rc.ok{background:#fafffc}.rc.missing,.rc.expired{background:#fffafa}.rc.needexp{background:#fffdf6;border-left-color:#e0a100}
.pv{background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:14px}.pvh{font-weight:700;margin-bottom:6px}
.pv ul{list-style:none;margin:0;padding:0}.pv li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:14px}.pv li b{white-space:nowrap}.pvt{text-align:right;font-weight:700;margin-top:6px;color:var(--brand)}
.btn.big{width:100%;box-shadow:0 4px 12px #0f4c6e44}
</style>
</head>
<body>
<header><div class="hw"><img id="logo" alt="" onerror="this.style.display='none'"><h1 id="ttl"></h1><div class="lang"><button id="l-en" onclick="setLang('en')">English</button><button id="l-bn" onclick="setLang('bn')">বাংলা</button></div></div></header>
<main id="app"></main>
<input type="file" id="jf" accept=".json,application/json" hidden>
<input type="file" id="pf" accept=".pdf,application/pdf" multiple hidden>

    return `<div class="fi ${mt.length?'dup':''}"><div><b>${esc(f.name)}</b><small>${f.pages} ${f.pages>1?L.pages:L.page} · ${(f.size/1024).toFixed(0)} KB</small>
    ${mt.length?`<small style="color:var(--warn);font-weight:600">⚠ ${L.dup} ${mt.map(m=>esc(m.name)).join(', ')}</small>`:''}
    <small>${r?`✓ ${L.usedFor} ${esc(rname(r))}`:L.notUsed}</small></div><button class="x" onclick="removeFile(${f.id})">${L.rm}</button></div>`}).join(''):`<div class="empty">${L.noFiles}</div>`;
  const why=nb.length?`<div class="why"><b>${L.blk}</b><ul>${nb.map(x=>`<li>${esc(rname(x.r))}: ${L.st[x.s]}</li>`).join('')}</ul></div>`:S.files.length?`<div class="good">✓ ${L.okAll}</div>`:`<div class="why"><b>${L.blk}</b><ul>${nb.length?'':sts.filter(x=>blocking(x.s)).length}</ul></div>`;
  let pp=2,pvr='';sts.forEach(x=>{const f=fileOf(x.r.id);if(f){pvr+=`<li><span>${esc(rname(x.r))}</span><b>${L.pg} ${pp}${f.pages>1?'–'+(pp+f.pages-1):''}</b></li>`;pp+=f.pages}});
  const pv=`<div class="pv"><div class="pvh">${L.pvT}</div><ul><li><span>${L.cover}</span><b>${L.pg} 1</b></li>${pvr}</ul><div class="pvt">${L.total}: ${pp-1} ${L.pages}</div></div>`;
  const nx=!S.files.length?L.nx1:nb.length?L.nx2.replace('{n}',nb.length):L.nx3;
  $('app').innerHTML=`${al}<div class="nxt ${S.files.length?(nb.length?'warn':'good2'):''}">👉 ${nx}</div><div class="steps">${stp}</div>
  <div class="card">${sh('📋',L.tender,L.hlpT)}<div class="tg">${info}</div><p class="ro"><span class="dl ${dd<0?'late':dd<4?'soon':''}">⏳ ${dtx}</span><button class="btn sec" onclick="$('jf').click()">${L.other}</button></p></div>
  <div class="cols"><div><div class="card">${sh('🗂️',L.docs,L.hlpD)}
    <div class="sum"><span class="chip s-ok">${L.sumOk}: ${nok}</span><span class="chip s-missing">${L.sumBlock}: ${nb.length}</span><span class="chip s-notprov">${L.sumOpt}: ${nopt}</span></div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <p style="margin:0 0 12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" onclick="autoMatch()" ${S.files.length?'':'disabled'}>${L.auto}</button><button class="btn sec" onclick="exportCsv()">${L.csv}</button></p>${cards}</div></div>
  <div><div class="card">${sh('📤',`${L.files} (${S.files.length}/30)`,L.hlpF)}<div class="drop" id="pd" tabindex="0" style="padding:16px;margin-bottom:12px"><b style="font-size:16px">${L.upB}</b><span>${L.upS}</span></div>${fl}</div>
  <div class="card">${sh('📦',L.genH,L.hlpG)}${pv}${why}<button class="btn big" onclick="generate()" ${nb.length||S.busy||!S.files.length?'disabled':''}>${S.busy?L.making:L.gen}</button></div><div class="card tips"><h2>💡 ${L.tipsT}</h2><ul><li>${L.tip1}</li><li>${L.tip2}</li><li>${L.tip3}</li><li>${L.tip4}</li></ul></div></div></div><div class="priv">🔒 ${L.priv}</div>`;
  wire();
}
function wire(){
  [['jd','jf',loadJson,1],['pd','pf',addFiles,0]].forEach(([d,i,fn,one])=>{const el=$(d);if(!el)return;
    el.onclick=()=>$(i).click();el.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')$(i).click()};
    el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');
    el.ondrop=e=>{e.preventDefault();el.classList.remove('over');const fs=[...e.dataTransfer.files];if(fs.length)one?fn(fs[0]):fn(fs)}});
}
$('jf').onchange=e=>{if(e.target.files[0])loadJson(e.target.files[0]);e.target.value=''};
$('pf').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
render();
</script>
</body>
</html>
